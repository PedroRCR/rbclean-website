<div class="gallery">
  <div class="section-header">
    <h2 class="section-title">{{ 'gallery.title' | t }}</h2>
    <p class="section-description">{{ 'gallery.description' | t }}</p>
  </div>

  <!-- Swipe left/right to change photo; click/tap to open it large. -->
  <div class="stage" (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)">
    <!-- Blurred copy of the photo fills the space around portrait/landscape photos. -->
    <div class="stage-backdrop" [style.background-image]="'url(' + image.thumb + ')'" aria-hidden="true"></div>
    <button class="zoom" (click)="openLightbox()" [attr.aria-label]="'gallery.zoom' | t">
      <img [src]="image.full" [alt]="altFor(current)" draggable="false" />
    </button>
    <span class="counter" aria-hidden="true">{{ current + 1 }} / {{ images.length }}</span>
    <button class="arrow left-arrow" (click)="previousImage()" [attr.aria-label]="'gallery.previous' | t">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
    </button>
    <button class="arrow right-arrow" (click)="nextImage()" [attr.aria-label]="'gallery.next' | t">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
    </button>
  </div>

  <ng-container [ngTemplateOutlet]="thumbs"></ng-container>
</div>

<!-- Large-image popup. -->
@if (lightboxOpen) {
  <div
    #lightbox
    class="lightbox"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'gallery.dialog' | t"
    (click)="onBackdropClick($event)"
  >
    <span class="lightbox-counter" aria-hidden="true">{{ current + 1 }} / {{ images.length }}</span>
    <button class="lightbox-close" (click)="closeLightbox()" [attr.aria-label]="'gallery.close' | t">
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>

    <div class="lightbox-stage" (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)">
      <img class="lightbox-image" [src]="image.full" [alt]="altFor(current)" draggable="false" />
      <button class="arrow left-arrow" (click)="previousImage()" [attr.aria-label]="'gallery.previous' | t">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
      </button>
      <button class="arrow right-arrow" (click)="nextImage()" [attr.aria-label]="'gallery.next' | t">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </button>
    </div>

    <ng-container [ngTemplateOutlet]="thumbs"></ng-container>
  </div>
}

<!-- Thumbnail strip (same order as the photos), used below the gallery and in the popup. -->
<ng-template #thumbs>
  <div class="thumbs">
    @for (img of images; track img.full; let i = $index) {
      <button
        class="thumb"
        [class.active]="i === current"
        [attr.aria-current]="i === current ? 'true' : null"
        [attr.aria-label]="altFor(i)"
        (click)="show(i)"
      >
        <img [src]="img.thumb" alt="" loading="lazy" draggable="false" />
      </button>
    }
  </div>
</ng-template>
