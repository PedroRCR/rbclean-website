<div class="gallery">
  <div class="main-image">
    <img [src]="images[0]" alt="Trabalho realizado pela RB Clean" />
    <button class="arrow left-arrow" (click)="previousImage()" aria-label="Imagem anterior">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
    </button>
    <button class="arrow right-arrow" (click)="nextImage()" aria-label="Imagem seguinte">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
    </button>
  </div>
  <div class="secondary-images">
    @for (img of images.slice(1); track img) {
      <div class="image" [style.background-image]="'url(' + img + ')'"></div>
    }
  </div>
</div>
