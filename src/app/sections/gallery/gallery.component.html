<div class="gallery">
  <div class="main-image">
    <button class="zoom" (click)="openLightbox()" aria-label="Ver imagem em grande">
      <img [src]="images[0]" alt="Trabalho realizado pela RB Clean" />
    </button>
    <button class="arrow left-arrow" (click)="previousImage()" aria-label="Imagem anterior">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
    </button>
    <button class="arrow right-arrow" (click)="nextImage()" aria-label="Imagem seguinte">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
    </button>
  </div>
  <div class="secondary-images">
    @for (img of images.slice(1); track img) {
      <button
        class="image"
        [style.background-image]="'url(' + img + ')'"
        (click)="goTo(img)"
        aria-label="Mostrar esta imagem"
      ></button>
    }
  </div>
</div>

<!-- Popup com a imagem em grande (fora da .gallery para não ser cortado pelo overflow). -->
@if (lightboxOpen) {
  <div
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Galeria de trabalhos"
    (click)="onBackdropClick($event)"
  >
    <button class="lightbox-close" (click)="closeLightbox()" aria-label="Fechar">
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>

    <div class="lightbox-stage">
      <img class="lightbox-image" [src]="images[0]" alt="Trabalho realizado pela RB Clean" />
      <button class="arrow left-arrow" (click)="previousImage()" aria-label="Imagem anterior">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
      </button>
      <button class="arrow right-arrow" (click)="nextImage()" aria-label="Imagem seguinte">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </button>
    </div>

    <div class="lightbox-thumbs">
      @for (img of images.slice(1); track img) {
        <button class="lightbox-thumb" (click)="goTo(img)" aria-label="Mostrar esta imagem">
          <img [src]="img" alt="" />
        </button>
      }
    </div>
  </div>
}
