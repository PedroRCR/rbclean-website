<div class="gallery">
  <div class="main-image">
    <button class="zoom" (click)="openLightbox()" [attr.aria-label]="'gallery.zoom' | t">
      <img [src]="images[0].full" [alt]="'gallery.imageAlt' | t" />
    </button>
    <button class="arrow left-arrow" (click)="previousImage()" [attr.aria-label]="'gallery.previous' | t">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
    </button>
    <button class="arrow right-arrow" (click)="nextImage()" [attr.aria-label]="'gallery.next' | t">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
    </button>
  </div>
  <div class="secondary-images">
    @for (img of images.slice(1); track img.full) {
      <button
        class="image"
        [style.background-image]="'url(' + img.thumb + ')'"
        (click)="goTo(img)"
        [attr.aria-label]="'gallery.show' | t"
      ></button>
    }
  </div>
</div>

<!-- Large-image popup (outside .gallery so its overflow does not clip it). -->
@if (lightboxOpen) {
  <div
    #lightbox
    class="lightbox"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'gallery.dialog' | t"
    (click)="onBackdropClick($event)"
  >
    <button class="lightbox-close" (click)="closeLightbox()" [attr.aria-label]="'gallery.close' | t">
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>

    <div class="lightbox-stage">
      <img class="lightbox-image" [src]="images[0].full" [alt]="'gallery.imageAlt' | t" />
      <button class="arrow left-arrow" (click)="previousImage()" [attr.aria-label]="'gallery.previous' | t">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
      </button>
      <button class="arrow right-arrow" (click)="nextImage()" [attr.aria-label]="'gallery.next' | t">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </button>
    </div>

    <div class="lightbox-thumbs">
      @for (img of images.slice(1); track img.full) {
        <button class="lightbox-thumb" (click)="goTo(img)" [attr.aria-label]="'gallery.show' | t">
          <img [src]="img.thumb" alt="" loading="lazy" />
        </button>
      }
    </div>
  </div>
}
