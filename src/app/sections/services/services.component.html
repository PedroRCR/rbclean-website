<div class="services-section">
  <div class="section-title">
    <span>{{ 'services.title' | t }}</span>
  </div>

  <div class="section-description">
    {{ 'services.description' | t }}
  </div>

  <div class="services-grid">
    <div class="carousel-nav">
      <button (click)="prev()" [disabled]="currentIndex === 0" [attr.aria-label]="'services.previous' | t">‹</button>
      <button
        (click)="next()"
        [attr.aria-label]="'services.next' | t"
        [disabled]="currentIndex === services.length - 1"
      >
        ›
      </button>
    </div>
    <div class="cards-track" #servicesGrid>
      @for (service of services; track $index) {
        <div class="service-card">
          <app-service-card [title]="service.titleKey | t" [image]="service.image" />
        </div>
      }
    </div>
  </div>
</div>
