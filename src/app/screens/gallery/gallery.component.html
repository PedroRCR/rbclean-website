<section id="gallery">
  <div class="section-title">
    <span>Galeria de Trabalhos</span>
  </div>

  <div class="gallery-grid">
    <div
      class="gallery-item"
      *ngFor="let photo of photos"
      (click)="openLightbox(photo)">
      <img [src]="photo.src" [alt]="photo.alt" loading="lazy" />
      <div class="gallery-overlay">
        <span class="overlay-icon">&#43;</span>
        <span class="overlay-label">{{ photo.alt }}</span>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" *ngIf="selectedImage" (click)="closeLightbox()">
    <button class="lightbox-close" (click)="closeLightbox()">&#10005;</button>

    <button class="lightbox-nav lightbox-nav--prev" (click)="$event.stopPropagation(); navigate(-1)">
      &#8249;
    </button>

    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <img [src]="selectedImage.src" [alt]="selectedImage.alt" />
      <p class="lightbox-caption">{{ selectedImage.alt }}</p>
    </div>

    <button class="lightbox-nav lightbox-nav--next" (click)="$event.stopPropagation(); navigate(1)">
      &#8250;
    </button>
  </div>
</section>
