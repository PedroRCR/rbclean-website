<div class="evaluation-body">
  <div class="evaluation-header">
    <strong>{{ name }}</strong
    >&nbsp;·&nbsp;<span class="evaluation-star" aria-hidden="true">★</span
    ><strong [attr.aria-label]="numberOfStars + ' ' + ('evaluations.outOf5' | t)">{{
      ratingText
    }}</strong>
  </div>
  <div class="evaluation-comments">{{ comment }}</div>
</div>
