<header>
  <div class="header-container">
    <a class="logo-container header-left" href="#home">
      <div class="logo-img">
        <img src="assets/images/rbclean-logo.webp" alt="RB Clean" width="227" height="230" />
      </div>
      <div class="logo-text">
        <app-logo-text></app-logo-text>
      </div>
    </a>
    <div class="header-center">
      <nav class="header-options">
        @for (item of navItems; track item.sectionId) {
          <header-item [text]="item.label" [sectionId]="item.sectionId"></header-item>
        }
      </nav>
    </div>
    <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Menu">
      <span class="material-symbols-outlined">
        {{ menuOpen ? "close" : "menu" }}
      </span>
    </button>
  </div>

  <!-- Mobile menu OUTSIDE header-container -->
  <div class="mobile-menu" [class.active]="menuOpen">
    <nav>
      @for (item of navItems; track item.sectionId) {
        <a [href]="'#' + item.sectionId" (click)="closeMenu()">{{ item.label }}</a>
      }
    </nav>
  </div>
</header>
