<header>
  <div class="header-container" [class.at-home]="atHome" [class.menu-open]="menuOpen">
    <a class="logo-container header-left" href="#home" [class.hidden]="atHome">
      <div class="logo-img">
        <img
          src="assets/images/rbclean-logo.webp"
          alt="RB Clean"
          width="227"
          height="230"
        />
      </div>
      <div class="logo-text">
        <app-logo-text></app-logo-text>
      </div>
    </a>
    <div class="header-center">
      <nav class="header-options">
        @for (item of navItems; track item.sectionId) {
          <header-item
            [text]="item.labelKey | t"
            [sectionId]="item.sectionId"
            [active]="item.sectionId === activeSection"
          ></header-item>
        }
      </nav>
    </div>
    <!-- Botões PT/EN no header (só desktop; em mobile ficam dentro do menu). -->
    <div class="lang-switch header-lang" role="group" [attr.aria-label]="'nav.language' | t">
      <ng-container [ngTemplateOutlet]="langButtons"></ng-container>
    </div>
    <button
      class="hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="'nav.menu' | t"
    >
      <span class="material-symbols-outlined">
        {{ menuOpen ? "close" : "menu" }}
      </span>
    </button>
  </div>

  <!-- Mobile menu OUTSIDE header-container -->
  <div class="mobile-menu" [class.active]="menuOpen">
    <nav>
      @for (item of navItems; track item.sectionId) {
        <a
          [href]="'#' + item.sectionId"
          [class.active]="item.sectionId === activeSection"
          (click)="closeMenu()"
          >{{ item.labelKey | t }}</a
        >
      }
    </nav>
    <div class="lang-switch menu-lang" role="group" [attr.aria-label]="'nav.language' | t">
      <ng-container [ngTemplateOutlet]="langButtons"></ng-container>
    </div>
  </div>
</header>

<ng-template #langButtons>
  @for (lang of langs; track lang) {
    <button
      [class.active]="i18n.lang() === lang"
      [attr.aria-pressed]="i18n.lang() === lang"
      (click)="i18n.setLang(lang)"
    >
      {{ lang.toUpperCase() }}
    </button>
  }
</ng-template>
